name: Polymarket monitor

on:
  schedule:
    # Every 10 minutes, around the clock (sports run evenings and weekends).
    # Offset from the top of the hour: GitHub delays :00 runs the most.
    # PRIVATE repo on the free plan (~2,000 Actions min/month)? Use every 30 min:
    #   '3,33 * * * *'
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print alerts in the log, send nothing, save nothing'
        type: boolean
        default: false

concurrency:
  group: polymarket-monitor
  cancel-in-progress: false

permissions:
  contents: write   # only used to save state.json to the 'monitor-state' branch

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # optional tuning: repository *variables* (Settings > Secrets and variables > Variables)
      TOP_N: ${{ vars.TOP_N }}
      LEADERBOARD_WINDOW: ${{ vars.LEADERBOARD_WINDOW }}
      WINDOW_HOURS: ${{ vars.WINDOW_HOURS }}
      MIN_WALLETS: ${{ vars.MIN_WALLETS }}
      CLUSTER_WINDOW_MIN: ${{ vars.CLUSTER_WINDOW_MIN }}
      MAX_ALERT_AGE_MIN: ${{ vars.MAX_ALERT_AGE_MIN }}
      MIN_WALLET_USD: ${{ vars.MIN_WALLET_USD }}
      CLUSTER_MIN_USD: ${{ vars.CLUSTER_MIN_USD }}
      LARGE_BET_USD: ${{ vars.LARGE_BET_USD }}
      MAX_PRICE: ${{ vars.MAX_PRICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch -q --depth=1 origin monitor-state
            git show FETCH_HEAD:state.json > state/state.json
            echo "restored state"
          else
            echo "no saved state yet (first run)"
          fi

      - name: Run monitor
        run: python -m polymarket_monitor ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # One commit on the monitor-state branch, force-pushed, so history never grows.
      - name: Save state
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f state/state.json ] || exit 0
          d=$(mktemp -d)
          cp state/state.json "$d/state.json"
          cd "$d"
          git init -q -b monitor-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" monitor-state
